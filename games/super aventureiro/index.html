<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Aventureiro - Jogo de Plataforma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        canvas {
            border: 2px solid #333;
            image-rendering: pixelated;
        }
        #info {
            color: white;
            margin-top: 10px;
            text-align: center;
        }
        .controls {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="info">
        <div id="levelDisplay">FASE 1</div>
        <div id="scoreDisplay">Moedas: 0 / 5</div>
        <div class="controls">🎮 Gamepad: D-Pad/analógico para mover, A para pular | ⌨️ Teclado: Setas + Espaço</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Configurações do canvas
        canvas.width = 800;
        canvas.height = 400;
        
        // Variáveis do jogo
        let gameState = 'playing'; // 'playing', 'win', 'gameover'
        let currentLevel = 1;
        let totalCoins = 0;
        const coinsPerLevel = 5;
        
        // Jogador
        const player = {
            x: 50,
            y: 300,
            width: 30,
            height: 40,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpForce: -10,
            gravity: 0.5,
            grounded: false,
            color: '#e74c3c',
            facing: 1 // 1 = direita, -1 = esquerda
        };
        
        // Plataformas, inimigos e moedas
        let platforms = [];
        let enemies = [];
        let coins = [];
        let flag = { x: 0, y: 0, width: 20, height: 60 };
        
        // Controles
        const keys = {};
        let gamepadConnected = false;
        
        // Inicializar níveis
        function loadLevel(level) {
            platforms = [];
            enemies = [];
            coins = [];
            
            // Plataformas base (chão)
            platforms.push({ x: 0, y: 370, width: 800, height: 30, color: '#8B4513' });
            
            switch(level) {
                case 1: // Fase 1 - Tutorial
                    platforms.push({ x: 200, y: 300, width: 100, height: 15, color: '#654321' });
                    platforms.push({ x: 400, y: 250, width: 100, height: 15, color: '#654321' });
                    platforms.push({ x: 600, y: 300, width: 100, height: 15, color: '#654321' });
                    
                    enemies.push({ x: 300, y: 340, width: 30, height: 30, vx: 1, color: '#27ae60', type: 'ground' });
                    enemies.push({ x: 500, y: 340, width: 30, height: 30, vx: -1.5, color: '#27ae60', type: 'ground' });
                    
                    coins.push({ x: 220, y: 270, collected: false });
                    coins.push({ x: 420, y: 220, collected: false });
                    coins.push({ x: 620, y: 270, collected: false });
                    coins.push({ x: 350, y: 340, collected: false });
                    coins.push({ x: 650, y: 340, collected: false });
                    
                    flag = { x: 750, y: 310, width: 20, height: 60 };
                    player.x = 50;
                    player.y = 300;
                    break;
                    
                case 2: // Fase 2 - Mais difícil
                    platforms.push({ x: 150, y: 320, width: 80, height: 15, color: '#654321' });
                    platforms.push({ x: 300, y: 270, width: 80, height: 15, color: '#654321' });
                    platforms.push({ x: 450, y: 220, width: 80, height: 15, color: '#654321' });
                    platforms.push({ x: 600, y: 270, width: 80, height: 15, color: '#654321' });
                    
                    enemies.push({ x: 200, y: 340, width: 30, height: 30, vx: 2, color: '#e67e22', type: 'ground' });
                    enemies.push({ x: 400, y: 340, width: 30, height: 30, vx: -2, color: '#e67e22', type: 'ground' });
                    enemies.push({ x: 550, y: 340, width: 30, height: 30, vx: 1.5, color: '#e67e22', type: 'ground' });
                    
                    coins.push({ x: 170, y: 290, collected: false });
                    coins.push({ x: 320, y: 240, collected: false });
                    coins.push({ x: 470, y: 190, collected: false });
                    coins.push({ x: 250, y: 340, collected: false });
                    coins.push({ x: 620, y: 240, collected: false });
                    
                    flag = { x: 750, y: 310, width: 20, height: 60 };
                    player.x = 50;
                    player.y = 300;
                    break;
                    
                case 3: // Fase 3 - Desafio final
                    platforms.push({ x: 100, y: 330, width: 60, height: 15, color: '#654321' });
                    platforms.push({ x: 200, y: 280, width: 60, height: 15, color: '#654321' });
                    platforms.push({ x: 300, y: 230, width: 60, height: 15, color: '#654321' });
                    platforms.push({ x: 450, y: 180, width: 60, height: 15, color: '#654321' });
                    platforms.push({ x: 600, y: 230, width: 60, height: 15, color: '#654321' });
                    
                    enemies.push({ x: 150, y: 340, width: 30, height: 30, vx: 2.5, color: '#c0392b', type: 'ground' });
                    enemies.push({ x: 350, y: 340, width: 30, height: 30, vx: -2, color: '#c0392b', type: 'ground' });
                    enemies.push({ x: 500, y: 340, width: 30, height: 30, vx: 2, color: '#c0392b', type: 'ground' });
                    enemies.push({ x: 650, y: 340, width: 30, height: 30, vx: -2.5, color: '#c0392b', type: 'ground' });
                    
                    coins.push({ x: 120, y: 300, collected: false });
                    coins.push({ x: 220, y: 250, collected: false });
                    coins.push({ x: 320, y: 200, collected: false });
                    coins.push({ x: 470, y: 150, collected: false });
                    coins.push({ x: 620, y: 200, collected: false });
                    
                    flag = { x: 750, y: 310, width: 20, height: 60 };
                    player.x = 50;
                    player.y = 300;
                    break;
            }
            
            player.vx = 0;
            player.vy = 0;
            totalCoins = 0;
            updateDisplay();
        }
        
        function updateDisplay() {
            document.getElementById('levelDisplay').textContent = `FASE ${currentLevel}`;
            document.getElementById('scoreDisplay').textContent = `Moedas: ${totalCoins} / ${coinsPerLevel}`;
        }
        
        // Detectar gamepad
        window.addEventListener("gamepadconnected", (e) => {
            console.log("Gamepad conectado:", e.gamepad.id);
            gamepadConnected = true;
        });
        
        window.addEventListener("gamepaddisconnected", (e) => {
            console.log("Gamepad desconectado:", e.gamepad.id);
            gamepadConnected = false;
        });
        
        // Teclado
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        function getGamepadInput() {
            if (!gamepadConnected) return null;
            
            const gamepads = navigator.getGamepads();
            if (!gamepads) return null;
            
            for (let gamepad of gamepads) {
                if (gamepad && gamepad.connected) {
                    return gamepad;
                }
            }
            return null;
        }
        
        function update() {
            if (gameState !== 'playing') {
                // Reiniciar com Enter ou botão A do gamepad
                const gamepad = getGamepadInput();
                if (keys['Enter'] || (gamepad && gamepad.buttons[0].pressed)) {
                    if (gameState === 'gameover') {
                        currentLevel = 1;
                        loadLevel(1);
                        gameState = 'playing';
                    } else if (gameState === 'win') {
                        if (currentLevel < 3) {
                            currentLevel++;
                            loadLevel(currentLevel);
                            gameState = 'playing';
                        } else {
                            // Vitória final - reiniciar jogo
                            currentLevel = 1;
                            loadLevel(1);
                            gameState = 'playing';
                        }
                    }
                }
                return;
            }
            
            // Input do teclado
            let moveLeft = keys['ArrowLeft'] || keys['KeyA'];
            let moveRight = keys['ArrowRight'] || keys['KeyD'];
            let jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
            
            // Input do gamepad
            const gamepad = getGamepadInput();
            if (gamepad) {
                // D-pad ou analógico esquerdo
                if (gamepad.axes[0] < -0.5) moveLeft = true;
                if (gamepad.axes[0] > 0.5) moveRight = true;
                if (gamepad.buttons[14]?.pressed) moveLeft = true; // D-pad esquerda
                if (gamepad.buttons[15]?.pressed) moveRight = true; // D-pad direita
                if (gamepad.buttons[0]?.pressed) jump = true; // Botão A
            }
            
            // Movimento horizontal
            if (moveLeft) {
                player.vx = -player.speed;
                player.facing = -1;
            } else if (moveRight) {
                player.vx = player.speed;
                player.facing = 1;
            } else {
                player.vx = 0;
            }
            
            // Pulo
            if (jump && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }
            
            // Gravidade
            player.vy += player.gravity;
            player.y += player.vy;
            
            // Verificar colisão com plataformas
            player.grounded = false;
            for (let plat of platforms) {
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y) {
                    
                    // Colisão por cima
                    if (player.vy > 0 && player.y + player.height - player.vy <= plat.y) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                    // Colisão por baixo
                    else if (player.vy < 0 && player.y - player.vy >= plat.y + plat.height) {
                        player.y = plat.y + plat.height;
                        player.vy = 0;
                    }
                }
            }
            
            // Movimento horizontal com colisão
            player.x += player.vx;
            for (let plat of platforms) {
                if (player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.height &&
                    player.y + player.height > plat.y) {
                    
                    if (player.vx > 0) {
                        player.x = plat.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = plat.x + plat.width;
                    }
                    player.vx = 0;
                }
            }
            
            // Limites da tela
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            
            // Cair do mapa
            if (player.y > canvas.height) {
                gameState = 'gameover';
            }
            
            // Atualizar inimigos
            for (let enemy of enemies) {
                enemy.x += enemy.vx;
                
                // Verificar colisão com plataformas para inimigos
                let enemyGrounded = false;
                for (let plat of platforms) {
                    if (enemy.x < plat.x + plat.width &&
                        enemy.x + enemy.width > plat.x &&
                        enemy.y + enemy.height <= plat.y + plat.height &&
                        enemy.y + enemy.height >= plat.y) {
                        enemyGrounded = true;
                    }
                }
                
                // Mudar direção nos limites ou bordas de plataforma
                if (enemy.x <= 0 || enemy.x >= canvas.width - enemy.width || !enemyGrounded) {
                    enemy.vx = -enemy.vx;
                }
                
                // Colisão com jogador
                if (player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y) {
                    
                    // Pular em cima do inimigo
                    if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y) {
                        enemies.splice(enemies.indexOf(enemy), 1);
                        player.vy = player.jumpForce / 2;
                    } else {
                        gameState = 'gameover';
                    }
                }
            }
            
            // Coletar moedas
            for (let coin of coins) {
                if (!coin.collected) {
                    if (player.x < coin.x + 15 &&
                        player.x + player.width > coin.x &&
                        player.y < coin.y + 15 &&
                        player.y + player.height > coin.y) {
                        coin.collected = true;
                        totalCoins++;
                        updateDisplay();
                    }
                }
            }
            
            // Verificar bandeira de fim de fase
            if (player.x < flag.x + flag.width &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.height &&
                player.y + player.height > flag.y) {
                
                if (totalCoins >= coinsPerLevel) {
                    if (currentLevel < 3) {
                        gameState = 'win';
                    } else {
                        gameState = 'win';
                        currentLevel = 3; // Manter para mensagem final
                    }
                }
            }
        }
        
        function draw() {
            // Fundo com gradiente (céu)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#98FB98');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Nuvens decorativas
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(100, 50, 25, 0, Math.PI * 2);
            ctx.arc(130, 45, 30, 0, Math.PI * 2);
            ctx.arc(160, 50, 25, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(500, 70, 20, 0, Math.PI * 2);
            ctx.arc(525, 65, 25, 0, Math.PI * 2);
            ctx.arc(550, 70, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Plataformas
            for (let plat of platforms) {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                // Textura de tijolos
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 1;
                for (let i = 0; i < plat.width; i += 20) {
                    ctx.strokeRect(plat.x + i, plat.y, 20, plat.height);
                }
            }
            
            // Moedas
            for (let coin of coins) {
                if (!coin.collected) {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(coin.x + 7, coin.y + 7, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Brilho
                    ctx.fillStyle = '#FFF8DC';
                    ctx.beginPath();
                    ctx.arc(coin.x + 5, coin.y + 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Inimigos
            for (let enemy of enemies) {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                // Olhos
                ctx.fillStyle = 'white';
                ctx.fillRect(enemy.x + 5, enemy.y + 5, 8, 8);
                ctx.fillRect(enemy.x + 17, enemy.y + 5, 8, 8);
                ctx.fillStyle = 'black';
                ctx.fillRect(enemy.x + 7, enemy.y + 7, 4, 4);
                ctx.fillRect(enemy.x + 19, enemy.y + 7, 4, 4);
            }
            
            // Bandeira
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(flag.x, flag.y, 5, flag.height);
            ctx.fillStyle = currentLevel === 1 ? '#e74c3c' : currentLevel === 2 ? '#3498db' : '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(flag.x + 5, flag.y);
            ctx.lineTo(flag.x + 30, flag.y + 15);
            ctx.lineTo(flag.x + 5, flag.y + 30);
            ctx.fill();
            
            // Jogador
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Chapéu
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(player.x - 2, player.y - 8, player.width + 4, 10);
            
            // Olhos
            ctx.fillStyle = 'white';
            if (player.facing === 1) {
                ctx.fillRect(player.x + 20, player.y + 8, 8, 8);
            } else {
                ctx.fillRect(player.x + 2, player.y + 8, 8, 8);
            }
            ctx.fillStyle = 'black';
            if (player.facing === 1) {
                ctx.fillRect(player.x + 22, player.y + 10, 4, 4);
            } else {
                ctx.fillRect(player.x + 4, player.y + 10, 4, 4);
            }
            
            // Estados do jogo
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e74c3c';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.fillText('Pressione ENTER ou 🎮 A para tentar novamente', canvas.width / 2, canvas.height / 2 + 30);
            } else if (gameState === 'win') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f1c40f';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                if (currentLevel < 3) {
                    ctx.fillText(`FASE ${currentLevel} COMPLETA!`, canvas.width / 2, canvas.height / 2 - 20);
                    ctx.fillStyle = 'white';
                    ctx.font = '20px Arial';
                    ctx.fillText('Pressione ENTER ou 🎮 A para próxima fase', canvas.width / 2, canvas.height / 2 + 30);
                } else {
                    ctx.fillText('🏆 VITÓRIA FINAL! 🏆', canvas.width / 2, canvas.height / 2 - 20);
                    ctx.fillStyle = 'white';
                    ctx.font = '20px Arial';
                    ctx.fillText('Pressione ENTER ou 🎮 A para jogar novamente', canvas.width / 2, canvas.height / 2 + 30);
                }
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Iniciar jogo
        loadLevel(1);
        gameLoop();
    </script>
</body>
</html>
